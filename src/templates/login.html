{% extends "base.html" %}
{% block title %}登录 - 学生成绩管理系统{% endblock %}
{% block login_body %}
<div class="login-wrap">
  <h1>学生成绩管理系统</h1>
  <div class="sub">请使用分配给你的账号登录</div>
  <form method="post">
    <div class="field">
      <label>用户名</label>
      <input type="text" name="user_name" required autofocus>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" name="password" required>
    </div>
    <button class="btn" type="submit">登录</button>
  </form>
  <div class="hint">
    演示账号<br>
    管理员 admin / 123456<br>
    教师 teacher01 / 123456<br>
    学生 2410311308 / 123456
  </div>
</div>
{% endblock %}
