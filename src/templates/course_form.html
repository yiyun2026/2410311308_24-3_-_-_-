{% extends "base.html" %}
{% block title %}{{ '新增课程' if is_new else '编辑课程' }}{% endblock %}
{% block body %}
<h1>{{ '新增课程' if is_new else '编辑课程' }}</h1>
<form method="post">
<div class="card">
  <div class="row">
    <div class="field"><label>课程号 *</label>
      <input type="text" name="course_no" value="{{ row.course_no if row else '' }}"
             {% if not is_new %}readonly{% endif %} required></div>
    <div class="field"><label>课程名称 *</label>
      <input type="text" name="course_name" value="{{ row.course_name if row else '' }}" required></div>
    <div class="field"><label>学分</label>
      <input type="number" step="0.5" name="credit" value="{{ row.credit if row else 2 }}"></div>
    <div class="field"><label>学期</label>
      <input type="text" name="term" value="{{ row.term if row else '' }}" placeholder="如 2025-2026-1"></div>
    <div class="field"><label>授课教师</label>
      <select name="teacher_no">
        <option value="">未指定</option>
        {% for t in teachers %}
        <option value="{{ t.teacher_no }}" {% if row and row.teacher_no == t.teacher_no %}selected{% endif %}>
          {{ t.teacher_no }} {{ t.name }}</option>
        {% endfor %}
      </select></div>
  </div>
  <button class="btn" type="submit">保存</button>
  <a class="btn gray" href="{{ url_for('course_list') }}">返回</a>
</div>
</form>
{% endblock %}
