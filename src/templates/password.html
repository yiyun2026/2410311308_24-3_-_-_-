{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block body %}
<h1>修改密码</h1>
<form method="post">
<div class="card" style="max-width:420px;">
  <div class="field" style="margin-bottom:12px;"><label>原密码</label>
    <input type="password" name="old" required></div>
  <div class="field" style="margin-bottom:16px;"><label>新密码</label>
    <input type="password" name="new" required>
    <span class="muted">不少于 4 位</span></div>
  <button class="btn" type="submit">确认修改</button>
  <a class="btn gray" href="{{ url_for('index') }}">返回</a>
</div>
</form>
{% endblock %}
